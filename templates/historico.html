{% extends "base.html" %}
{% block content %}
  <div class="space-y-6">
    <div>
      <h1 class="text-2xl font-semibold">Histórico de Chamados</h1>
      <p class="text-slate-400">Registros completos de mudanças de status.</p>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-lg">
      <div class="p-4 border-b border-slate-800">
        <h2 class="font-semibold">Últimos chamados</h2>
      </div>
      <div class="overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead class="text-left text-slate-400">
            <tr>
              <th class="px-4 py-3">Placa</th>
              <th class="px-4 py-3">Transportadora</th>
              <th class="px-4 py-3">Status anterior</th>
              <th class="px-4 py-3">Status novo</th>
              <th class="px-4 py-3">Mudança</th>
              <th class="px-4 py-3">Confirmado por</th>
              <th class="px-4 py-3">Confirmação</th>
            </tr>
          </thead>
          <tbody id="history-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>
{% endblock %}
