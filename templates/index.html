{% extends "base.html" %}
{% block content %}
  <div class="space-y-6">
    <div>
      <h1 class="text-2xl font-semibold">Painel Geral</h1>
      <p class="text-slate-400">
        Visão consolidada em tempo real dos veículos monitorados.
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-slate-900 border border-slate-800 rounded-lg p-6 card">
        <p class="text-sm text-slate-400">Veículos em FILA</p>
        <p id="fila-count" class="text-3xl font-bold">0</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-lg p-6 card">
        <p class="text-sm text-slate-400">Monitoramento ativo</p>
        <p class="text-3xl font-bold">Online</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-lg p-6 card">
        <p class="text-sm text-slate-400">Alertas críticos</p>
        <p class="text-3xl font-bold">Ativo</p>
      </div>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-lg card">
      <div class="p-4 border-b border-slate-800">
        <h2 class="font-semibold">Últimos veículos monitorados</h2>
      </div>
      <div class="overflow-x-auto table-wrap">
        <table class="min-w-full text-sm">
          <thead class="text-left text-slate-400">
            <tr>
              <th class="px-4 py-3">Placa</th>
              <th class="px-4 py-3">Transportadora</th>
              <th class="px-4 py-3">Status</th>
              <th class="px-4 py-3">Atualizado em</th>
            </tr>
          </thead>
          <tbody id="vehicles-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>
{% endblock %}
