{% extends "base.html" %}
{% block content %}
  <div class="space-y-6">
    <div>
      <h1 class="text-2xl font-semibold">Monitoramento em Tempo Real</h1>
      <p class="text-slate-400">
        Atualizações contínuas do scraping a cada ciclo.
      </p>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-lg">
      <div class="p-4 border-b border-slate-800">
        <h2 class="font-semibold">Veículos monitorados</h2>
      </div>
      <div class="overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead class="text-left text-slate-400">
            <tr>
              <th class="px-4 py-3">Placa</th>
              <th class="px-4 py-3">Transportadora</th>
              <th class="px-4 py-3">Status</th>
              <th class="px-4 py-3">Atualizado em</th>
            </tr>
          </thead>
          <tbody id="vehicles-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>
{% endblock %}
