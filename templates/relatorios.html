{% extends "base.html" %}
{% block content %}
  <div class="space-y-6">
    <div>
      <h1 class="text-2xl font-semibold">Relatórios</h1>
      <p class="text-slate-400">Indicadores e gráficos do monitoramento.</p>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-lg p-6">
      <canvas id="transportadora-chart" height="120"></canvas>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    fetch("/api/relatorios")
      .then((response) => response.json())
      .then((data) => {
        const ctx = document
          .getElementById("transportadora-chart")
          .getContext("2d");
        new Chart(ctx, {
          type: "bar",
          data: {
            labels: data.labels,
            datasets: [
              {
                label: "Veículos por transportadora",
                data: data.values,
                backgroundColor: "#38bdf8",
              },
            ],
          },
          options: {
            responsive: true,
            plugins: {
              legend: {
                labels: {
                  color: "#e2e8f0",
                },
              },
            },
            scales: {
              x: {
                ticks: {
                  color: "#e2e8f0",
                },
                grid: {
                  color: "rgba(148, 163, 184, 0.2)",
                },
              },
              y: {
                ticks: {
                  color: "#e2e8f0",
                },
                grid: {
                  color: "rgba(148, 163, 184, 0.2)",
                },
              },
            },
          },
        });
      });
  </script>
{% endblock %}
