<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - 2.0 Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen">
    <div class="bg-slate-900 border border-slate-800 rounded-lg p-8 w-full max-w-md">
      <h1 class="text-2xl font-semibold mb-2">Bem-vindo</h1>
      <p class="text-slate-400 mb-6">Acesse para continuar o monitoramento.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="space-y-2 mb-4">
            {% for category, message in messages %}
              <div class="p-3 rounded bg-red-500/20 border border-red-500/40 text-sm">
                {{ message }}
              </div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form method="POST" class="space-y-4">
        <div>
          <label class="text-sm text-slate-300">Usuário</label>
          <input
            type="text"
            name="username"
            class="mt-2 w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"
            required
          />
        </div>
        <div>
          <label class="text-sm text-slate-300">Senha</label>
          <input
            type="password"
            name="password"
            class="mt-2 w-full bg-slate-950 border border-slate-700 rounded px-3 py-2"
            required
          />
        </div>
        <button
          type="submit"
          class="w-full bg-sky-500 hover:bg-sky-400 text-slate-900 font-semibold py-2 rounded"
        >
          Entrar
        </button>
      </form>
    </div>
  </body>
</html>
